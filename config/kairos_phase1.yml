# Kairos Phase 1 Configuration
# Paper-faithful implementation of KAIROS queue detection
# Reference: KAIROS §4.3-4.4 (https://arxiv.org/abs/2308.05034)

preprocessing:
  build_graphs:
    used_method: default
    use_all_files: True
    mimicry_edge_num: 0
    time_window_size: 15.0  # 15-minute windows per KAIROS §4.3
    use_hashed_label: False
    fuse_edge: True
    node_label_features:
      subject: path
      file: path
      netflow: remote_ip, remote_port
    multi_dataset: none
  transformation:
    used_methods: none

featurization:
  feat_training:
    emb_dim: 16
    training_split: all
    used_method: hierarchical_hashing  # Kairos native feature extraction
  feat_inference:
    to_remove: True

detection:
  graph_preprocessing:
    save_on_disk: False
    node_features: node_emb,node_type
    edge_features: msg,time_encoding
    fix_buggy_graph_reindexer: False
    global_batching:
      used_method: none
    intra_graph_batching:
      used_methods: edges, tgn_last_neighbor
      edges:
        intra_graph_batch_size: 1024
      tgn_last_neighbor:
        tgn_neighbor_size: 20  # |N| = 20 per KAIROS §4.3
        tgn_neighbor_n_hop: 1
        fix_buggy_orthrus_TGN: False
        fix_tgn_neighbor_loader: False
        directed: False
        insert_neighbors_before: False
    inter_graph_batching:
      used_method: none
  
  gnn_training:
    used_method: default
    use_seed: True
    deterministic: False
    num_epochs: 12
    patience: 3
    lr: 0.00005
    weight_decay: 0.01
    node_hid_dim: 100
    node_out_dim: 100
    grad_accumulation: 1
    encoder:
      dropout: 0.0
      used_methods: graph_attention,tgn
      graph_attention:
        activation: relu
        num_heads: 4
        concat: True
        flow: source_to_target
        num_layers: 2
      tgn:
        tgn_memory_dim: 100
        tgn_time_dim: 100
        use_node_feats_in_gnn: False
        use_memory: True  # Kairos uses TGN memory per §4.2
        use_time_order_encoding: False
        project_src_dst: True
    decoder:
      used_methods: predict_edge_type
      predict_edge_type:
        balanced_loss: False
        use_triplet_types: False
        decoder: edge_mlp
        edge_mlp:
          architecture_str: linear(2) | dropout(0.5) | tanh | linear(0.25) | dropout(0.25) | tanh | linear(0.25) | dropout(0.5) | tanh
          src_dst_projection_coef: 2

  evaluation:
    viz_malicious_nodes: False
    ground_truth_version: orthrus
    best_model_selection: best_adp
    used_method: queue_evaluation  # Primary: queue-level detection
    
    # PRIMARY: Queue-level detection (native Kairos)
    # Note: Kairos calculates β threshold automatically from validation queues (§4.3.3)
    queue_evaluation:
      queue_threshold: 20  # Unused (Kairos calculates β dynamically)
      used_method: kairos_idf_queue
      kairos_idf_queue:
        include_test_set_in_IDF: True
        # IDF threshold α for "high IDF" suspicious nodes (KAIROS §4.3.1)
        # Paper does not specify fixed α value; tunable parameter calibrated on validation
        # Current: Use validation IDF distribution to derive α (e.g., percentile approach)
        idf_threshold_percentile: 0.9  # α derived from 90th percentile (calibrate on validation)
    
    # SECONDARY: Node-level evaluation (for cross-model comparison)
    # Note: Node-level metrics are evaluation-only. Kairos native detection is queue-level.
    node_evaluation:
      threshold_method: percentile  # Evaluation-only per ORTHRUS §4.4
      percentile_p: 78  # Tuned for ~10-50 TP range
      use_dst_node_loss: True
      use_kmeans: False  # Kairos doesn't use k-means (uses Louvain for summary graphs)
