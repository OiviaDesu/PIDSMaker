# MAGIC Phase 1 Configuration - Baseline (no adaptation)
# Paper-faithful implementation of MAGIC KNN outlier detection
# Reference: MAGIC §4.3-4.4 (https://www.usenix.org/conference/usenixsecurity24/presentation/jia)

preprocessing:
  build_graphs:
    used_method: default
    use_all_files: True
    mimicry_edge_num: 0
    time_window_size: 15.0
    use_hashed_label: False
    fuse_edge: True
    node_label_features:
      subject: path, cmd_line
      file: path
      netflow: remote_ip
    multi_dataset: none
  transformation:
    used_methods: none

featurization:
  feat_training:
    used_method: only_type  # Type-only features per MAGIC §4.2
  feat_inference:
    to_remove: True

detection:
  graph_preprocessing:
    save_on_disk: False
    node_features: node_type  # Only node type, no embeddings
    edge_features: none
    fix_buggy_graph_reindexer: False
    global_batching:
      used_method: none
    intra_graph_batching:
      used_methods: none
    inter_graph_batching:
      used_method: none
  
  gnn_training:
    used_method: default
    use_seed: True
    deterministic: False
    num_epochs: 12
    patience: 3
    lr: 0.001
    weight_decay: 0.0005
    node_hid_dim: 64
    node_out_dim: 64
    grad_accumulation: 1
    encoder:
      dropout: 0.0
      used_methods: magic_gat
      magic_gat:
        num_layers: 3  # Per MAGIC §4.2
        num_heads: 4
        negative_slope: 0.2
        alpha_l: 3.0  # Attention scaling
        activation: prelu
    decoder:
      used_methods: reconstruct_masked_features,predict_masked_struct
      reconstruct_masked_features:
        loss: SCE  # Symmetric Cross-Entropy
        mask_rate: 0.5  # 50% masking per §4.2
        decoder: magic_gat
        magic_gat:
          num_layers: 3
          num_heads: 4
          negative_slope: 0.2
      predict_masked_struct:
        loss: BCE
        decoder: node_mlp
        node_mlp:
          architecture_str: linear(4) | leaky_relu
        balanced_loss: False

  evaluation:
    viz_malicious_nodes: False
    ground_truth_version: orthrus
    best_model_selection: best_discrimination  # Baseline uses discrimination (F1/MCC), not adp_score
    used_method: node_evaluation
    
    node_evaluation:
      threshold_method: magic  # Magic's native threshold method (validation sweep)
      target_fpr: 0.01  # 1% FPR target per MAGIC §4.4
      knn_k: 20  # k=20 neighbors per MAGIC §4.3
      use_dst_node_loss: True
      use_kmeans: False
      enable_adaptation: False  # Baseline: no adaptation
